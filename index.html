<!DOCTYPE html>
<!-- ----------------------------------------------------------------------------
📌 DECLARACIÓN DEL TIPO DE DOCUMENTO
ETIQUETA: <!DOCTYPE html>
---------------------------------------------------------------------------------
- ¿Qué es?: Una instrucción especial (no es una etiqueta HTML propiamente dicha) que se coloca en la primera línea.
- ¿Qué hace?: Le indica al navegador web que el documento debe interpretarse bajo el estándar de HTML5.
- ¿Cómo lo hace?: Activa el modo estándar del navegador (Standard Mode) en lugar del modo de compatibilidad (Quirks Mode).
- ¿Por qué lo hace?: Garantiza que el navegador renderice la página correctamente utilizando las reglas modernas de diseño y APIs.
----------------------------------------------------------------------------- -->

<html lang="es">
<!-- ----------------------------------------------------------------------------
📌 NODO RAÍZ DEL DOCUMENTO HTML
ETIQUETA: <html lang="es">
---------------------------------------------------------------------------------
- ¿Qué es?: El elemento contenedor principal de todo el documento HTML. El atributo 'lang="es"' especifica el idioma principal.
- ¿Qué hace?: Envuelve todo el contenido del sitio web y le comunica al navegador y buscadores que el contenido está en español.
- ¿Cómo lo hace?: Los motores de búsqueda y lectores de pantalla leen el atributo 'lang' para adaptar la pronunciación o traducción.
- ¿Por qué lo hace?: Es una buena práctica para la accesibilidad web y el SEO (optimización en buscadores).
----------------------------------------------------------------------------- -->

   <head>
<!-- ----------------------------------------------------------------------------
📌 CABECERA DEL DOCUMENTO HTML
ETIQUETA: <head>
---------------------------------------------------------------------------------
- ¿Qué es?: Contenedor de metadatos, hojas de estilo y scripts que no se muestran directamente en el área visible de la página.
- ¿Qué hace?: Proporciona al navegador información técnica de configuración, enlaces a estilos y títulos del sitio.
- ¿Cómo lo hace?: Almacena etiquetas como <meta>, <link>, <title>, las cuales se procesan antes de dibujar la página.
- ¿Por qué lo hace?: Para cargar la configuración técnica, fuentes y estilos antes de que el usuario vea el cuerpo de la página.
----------------------------------------------------------------------------- -->

      <meta charset="utf-8" />
<!-- ----------------------------------------------------------------------------
📌 CODIFICACIÓN DE CARACTERES
ETIQUETA: <meta charset="utf-8" />
---------------------------------------------------------------------------------
- ¿Qué es?: Una etiqueta de metadatos que especifica la codificación de caracteres.
- ¿Qué hace?: Configura la página para usar la codificación de caracteres universal UTF-8.
- ¿Cómo lo hace?: Le indica al navegador que decodifique los bytes usando UTF-8, que incluye soporte para casi todos los caracteres del mundo.
- ¿Por qué lo hace?: Evita problemas de visualización con caracteres especiales, acentos (tildes), la letra "ñ" y símbolos propios del español.
----------------------------------------------------------------------------- -->

      <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ----------------------------------------------------------------------------
📌 CONFIGURACIÓN DE PÁGINA PARA DISPOSITIVOS MÓVILES (DISEÑO RESPONSIVO)
ETIQUETA: <meta name="viewport" ...>
---------------------------------------------------------------------------------
- ¿Qué es?: Un metadato de control del viewport (área visible del navegador).
- ¿Qué hace?: Configura el tamaño del área visible para adaptarse al ancho de pantalla del dispositivo con un zoom inicial de 100%.
- ¿Cómo lo hace?: 'width=device-width' establece el ancho de la página igual al ancho del dispositivo; 'initial-scale=1.0' define la escala inicial.
- ¿Por qué lo hace?: Es crucial para el diseño responsivo (responsive design), evitando que la web se vea diminuta en smartphones.
----------------------------------------------------------------------------- -->

      <meta name="generator" content="Geany 2.1" />
<!-- ----------------------------------------------------------------------------
📌 CONFIGURACIÓN DEL GENERADOR DE CÓDIGO
ETIQUETA: <meta name="generator" ...>
---------------------------------------------------------------------------------
- ¿Qué es?: Un metadato informativo que indica la herramienta de desarrollo utilizada.
- ¿Qué hace?: Declara al navegador u otros analizadores que la página se creó o editó en el entorno de desarrollo Geany 2.1.
- ¿Cómo lo hace?: El navegador lee el atributo 'content' pero no altera en nada la presentación visual de la página.
- ¿Por qué lo hace?: Con fines estadísticos o de documentación interna sobre la herramienta con la que se programó la estructura.
----------------------------------------------------------------------------- -->

      <link rel="stylesheet" href="assets\css\all.min.css">
<!-- ----------------------------------------------------------------------------
📌 ENLACE A LOS ICONOS DE FONT AWESOME
ETIQUETA: <link rel="stylesheet" href="assets\css\all.min.css">
---------------------------------------------------------------------------------
- ¿Qué es?: Una etiqueta de enlace externo ('<link>') que vincula un archivo de hojas de estilo (CSS).
- ¿Qué hace?: Carga la librería local Font Awesome para poder usar iconos en los botones (como el lápiz de editar o el basurero).
- ¿Cómo lo hace?: Realiza una petición GET para cargar las clases de iconos CSS que están guardadas en la carpeta 'assets\css\'.
- ¿Por qué lo hace?: Permite añadir iconos premium a la interfaz sin necesidad de usar imágenes pesadas de mapa de bits (JPG/PNG).
----------------------------------------------------------------------------- -->

      <link rel="stylesheet" href="assets\css\styles.css">
<!-- ----------------------------------------------------------------------------
📌 ENLACE A LOS ESTILOS PROPIOS DE LA APLICACIÓN
ETIQUETA: <link rel="stylesheet" href="assets\css\styles.css">
---------------------------------------------------------------------------------
- ¿Qué es?: Etiqueta de enlace externo que vincula la hoja de estilos personalizada de nuestra aplicación.
- ¿Qué hace?: Aplica los estilos visuales (colores, márgenes, alineación, tablas) definidos en el archivo 'styles.css'.
- ¿Cómo lo hace?: El navegador descarga el archivo y mapea las reglas CSS con las clases e IDs del documento HTML.
- ¿Por qué lo hace?: Mantiene separada la estructura (HTML) de la presentación y diseño visual (CSS), facilitando el mantenimiento.
----------------------------------------------------------------------------- -->
