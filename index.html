   <body>
      <main class="container backgroundColor1">
         <section>
            <h1 class="crud__title">CRUD con persistencia de datos (LocalStore)</h1>
            <br>
            <form action="#" id="formRegister" class="crud__form ">
               <div class="centrar paddingBackgroundColor0">
                  <input type"text" placeholder="Name" id="nameInput" class="form__input">
                  <input type"email" placeholder="Email" id="emailInput" class="form__input">
                  <br><br>
                  <button type="submit" id="submitButton" class="button button--primary"><i class="fas fa-plus"> ::before </i>
                     Crear</button>
               </div>
            </form>
            <br>
            <table class="crud__table">
               <thead class="backgroundColor2">
                  <tr>
                     <th class="table__header">Name</th>
                     <th class="table__header">Email</th>
                     <th class="table__header">Action</th>
                  </tr>
               </thead>
               <tbody id="tableBody" class="table__body"></tbody>
            </table>
         </section>

      </main>

   </body>
